[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "f1_project"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro[jupyter]~=1.7.0",
    "fastf1~=3.9.0",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "numpy>=1.26",
    "kedro-datasets[pandas-csvdataset, pandas-exceldataset, pandas-parquetdataset, plotly-plotlydataset, plotly-jsondataset, matplotlib-matplotlibdataset, spark-sparkdataset]>=9.1",
    "kedro-viz>=6.7.0",
    "scikit-learn~=1.5.1; python_version <= '3.10'",
    "scikit-learn~=1.8.0; python_version > '3.10'",
    "seaborn~=0.12.1",
]

[project.scripts]
"f1-project" = "f1_project.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
docs = [
    "docutils<0.21",
    "sphinx>=5.3,<7.3",
    "sphinx_rtd_theme==2.0.0",
    "nbsphinx==0.8.1",
    "sphinx-autodoc-typehints==1.20.2",
    "sphinx_copybutton==0.5.2",
    "ipykernel>=5.3, <7.0",
    "Jinja2<3.2.0",
    "myst-parser>=1.0,<2.1"
]
dev = [
    "pytest-cov>=6,<8",
    "pytest>=8,<10",
    "ruff>=0.12,<0.18"
]

[tool.setuptools.dynamic]
version = {attr = "f1_project.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "f1_project"
project_name = "f1-project"
kedro_init_version = "1.7.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Documentation', 'Data Structure', 'PySpark']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = """
--cov-report term-missing \
--cov src/f1_project -ra"""

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "W",   # pycodestyle
    "E",   # pycodestyle
    "I",   # isort
    "UP",  # pyupgrade
    "PL",  # Pylint
    "T201", # Print Statement
]
ignore = ["E501"]  # Ruff format takes care of line-too-long

[tool.kedro_telemetry]
project_id = "0765b6113cc74fc1be49e511c039cac0"

# Dataset dispatch and validation keep their checks together for auditability.
[tool.ruff.lint.per-file-ignores]
"src/f1_project/fastf1_archive.py" = ["PLC0415", "PLR0912", "PLR0915", "PLR0913"]
"src/f1_project/fastf1_cli.py" = ["PLC0415", "PLR0915", "PLR0912"]
"src/f1_project/pipelines/data_preparation/nodes.py" = ["PLR0912"]
"src/f1_project/quality.py" = ["PLR0912", "PLR0915"]
"src/f1_project/pipelines/data_ingestion/nodes.py" = ["PLC0415", "PLR0913", "PLR0917", "T201"]
"tests/test_fastf1_archive.py" = ["PLR2004"]
