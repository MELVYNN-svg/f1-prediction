fastf1_sessions:
  type: pandas.ParquetDataset
  filepath: "data/08_reporting/${runtime_params:year,${globals:year}}/fastf1_sessions.parquet"

# Acces direct sans preparation, exemples :
# fastf1_table__round_01__05_race__laps
# fastf1_driver__round_01__05_race__car_data__1
# session = le nom exact du dossier (03_sprint, 04_qualifying, 05_race...).
"fastf1_table__{event}__{session}__{table}":
  type: pandas.ParquetDataset
  filepath: "data/01_raw/fastf1/${runtime_params:year,${globals:year}}/{event}/{session}/{table}.parquet"

"fastf1_driver__{event}__{session}__{table}__{driver}":
  type: pandas.ParquetDataset
  filepath: "data/01_raw/fastf1/${runtime_params:year,${globals:year}}/{event}/{session}/{table}/{driver}.parquet"

# OpenF1 est une source distincte : ne pas melanger ses schemas avec FastF1.
openf1_meetings:
  type: pandas.ParquetDataset
  filepath: "data/01_raw/openf1/${runtime_params:year,${globals:year}}/meetings.parquet"

openf1_sessions:
  type: pandas.ParquetDataset
  filepath: "data/01_raw/openf1/${runtime_params:year,${globals:year}}/sessions.parquet"

"openf1_table__{session_key}__{table}":
  type: pandas.ParquetDataset
  filepath: "data/01_raw/openf1/${runtime_params:year,${globals:year}}/{session_key}/{table}.parquet"
