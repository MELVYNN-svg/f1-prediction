# Les fichiers bruts restent par evenement/session/pilote. Le chargement est
# paresseux : catalog.load("fastf1_raw") ne lit pas toute la telemetrie.
fastf1_raw:
  type: partitions.PartitionedDataset
  path: "data/01_raw/fastf1/${runtime_params:year,${globals:year}}"
  dataset: pandas.ParquetDataset
  filename_suffix: .parquet

# Tables de saison generees hors ligne par `kedro run`.
fastf1_events:
  type: pandas.ParquetDataset
  filepath: "data/03_primary/fastf1/${runtime_params:year,${globals:year}}/events.parquet"

fastf1_laps:
